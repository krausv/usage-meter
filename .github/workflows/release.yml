name: Release

# Tag a version (e.g. `git tag v0.1.0 && git push --tags`) to build, sign,
# notarize, and attach UsageMeter.dmg to the GitHub release for that tag.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   MACOS_CERT_P12_BASE64  base64 of your "Developer ID Application" .p12
#                          (export from Keychain Access, then: base64 -i cert.p12 | pbcopy)
#   MACOS_CERT_PASSWORD    the password you set when exporting the .p12
#   NOTARY_APPLE_ID        Apple ID email used for notarization
#   NOTARY_TEAM_ID         Developer Team ID (e.g. Z6YWGVCB3Q)
#   NOTARY_PASSWORD        app-specific password (account.apple.com → Sign-In & Security)

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Fail fast on broken code: the macos runner ships Xcode, so the full
      # XCTest suite (including fixtures) runs here — unlike CLT-only Macs.
      - name: Run unit tests
        run: swift test

      # Skip cleanly (green run, not a red X) if signing secrets aren't set yet.
      - name: Check signing secrets
        id: check
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
        run: |
          if [ -n "$CERT_B64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets not configured — skipping DMG build. See .github/workflows/release.yml for the required secrets."
          fi

      - name: Import Developer ID certificate
        if: steps.check.outputs.ready == 'true'
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KP="ci-keychain-$RANDOM"
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PW" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          # Hlasitý fail, když .p12 neobsahuje distribuční identitu —
          # jinak by build tiše spadl na ad-hoc a notarizace by chytla až později.
          security find-identity -v -p codesigning "$KEYCHAIN" | tee /dev/stderr \
            | grep -q "Developer ID Application" \
            || { echo "::error::Imported certificate has no 'Developer ID Application' identity. Export the Developer ID .p12 (Keychain Access → My Certificates), not Apple Development."; exit 1; }

      - name: Build, sign and notarize DMG
        if: steps.check.outputs.ready == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: ./scripts/make-dmg.sh

      - name: Attach DMG to the release
        if: steps.check.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: UsageMeter.dmg
          generate_release_notes: true
